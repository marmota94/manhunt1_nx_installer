# SPDX-License-Identifier: LGPL-2.1-only
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the staged port release
        run: python tools/update-release.py --check
      - name: Unit tests
        run: node --test test/unit.mjs
      - name: Browser tests (synthetic fixtures)
        run: |
          sudo apt-get install -y unzip
          pip install playwright
          python -m playwright install --with-deps chromium
          python test/browser.py

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the staged port release
        run: python tools/update-release.py --check
      - name: Assemble the site
        run: |
          version=$(python -c "import json; print(json.load(open('release/manifest.json'))['version'])")
          mkdir -p _site/release
          cp -r index.html sw.js css js LICENSE NOTICES.md _site/
          cp release/manifest.json "release/manhunt1-nx-v${version}.zip" _site/release/
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
